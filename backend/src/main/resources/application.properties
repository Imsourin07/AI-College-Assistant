server.port=8080

# Spring Application Name
spring.application.name=ai-college-assistant

# Database Configuration (Using H2 embedded in-memory by default for zero-config run, can switch to MySQL)
# To use local MySQL: Uncomment below and adjust credentials
# spring.datasource.url=jdbc:mysql://localhost:3306/college_assistant_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=root
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# H2 Database configuration (Embedded mode)
spring.datasource.url=jdbc:h2:mem:college_assistant_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Hibernate properties
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# File upload properties
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# JWT Configuration
jwt.secret=9a2f8c4e7b1d3a5f8e0c2b4a6f8d1e3c5a7b9d1e3f5a7c9b1d3e5f7a9c1b3d5e
jwt.expiration-ms=86400000

# Gemini AI API Configuration (Can set system env variable GEMINI_API_KEY or set here)
gemini.api.key=${GEMINI_API_KEY:DEMO_KEY}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent
