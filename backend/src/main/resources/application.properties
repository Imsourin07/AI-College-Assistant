# Default Profile
spring.profiles.active=dev

# Application Identity
spring.application.name=ai-college-assistant
server.port=8080

# Servlet Multipart configuration for PDF uploads
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# JWT Default Configuration (Override via environment in prod)
jwt.secret=${JWT_SECRET:9a2f8c4e7b1d3a5f8e0c2b4a6f8d1e3c5a7b9d1e3f5a7c9b1d3e5f7a9c1b3d5e}
jwt.expiration-ms=86400000

# Google Gemini API
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent
